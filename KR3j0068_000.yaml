body:
  text: 拾遺録雜家類二雜考之屬提要臣等謹案拾遺録一卷明胡爌撰爌有家規輯要已著録是書雜考訓詁分為六類援引採輯頗有根據如論語不舍晝夜朱子集注從經典釋文舍音捨及作楚詞辨證則取洪興祖所引顔師古說舍止息也論語不舍晝夜謂曉夕不息耳今人或音捨者非是爌謂當以辨證之說為定今也純集注從說文爌引儀禮疏古緇䊷二字並行釋文云䊷音緇依字糸旁才後人以才為純因作純是純即緇也君子不以紺緅飾孔氏注一入曰緅爌則引爾雅考工記以正其誤卞莊子之勇集注云見說苑爌則以為先見荀子邦無道則卷而懷之集注謂於孫林父寧殖放殺之謀不對而出爌則據左傳謂寧殖當作寧喜子見南子陳自明以為南蒯爌則據左傳南蒯叛時孔子年方二十有二子路少孔子九嵗年方十三詆其說為不通范祖禹古文孝經說言之不通也句爌謂誤以司馬光注為經文孟子摩頂放踵據李善文選注所引謂檢當作斂趙岐注以曽西為曽子之孫以曹交為曹君之弟集注並從之爌則據左傳鬬宜申公子申皆字子西證當從經典釋文以曽西即曽申據左傳哀公八年宋人滅曹證曹交乃以國為氏非曹君之弟又據吕氏春秋知孔子置郵𫝊命之言為論舜服三苗小學據參同契證急就篇之老復丁據詛楚文在秦惠文王二十六年知小篆非創自李斯據顧命齊侯吕伋知竹書稱太公卒於康王六年之妄據張說謝碑額表知以季札墓碑為孔子書始於唐人雖持論多本舊人然要非空疏者可比其經說司馬光語一條自漢儒至宋慶厯一條尤深中末流之失儷考論文考古亦多可採上方楊慎則不足下較焦竑則勝之多矣原本刻於明季分為十卷後板燬於火其書遂亡其裔孫得殘闕舊本復為掇拾僅存論語八十一條孝經十六條孟子七十四條小學四十二條經說二十一條儷考六十三條特十之一二而已然亦足以見其崖略矣乾隆四十六年十月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀欽定四庫全書拾遺録明胡爌撰論語八十一條或問論語首篇之次章即述有子之言而有子曽子獨以子稱何也曰程子謂此書成於有子曾子之門人也曰柳子謂孔子之後諸弟子以有子為似夫子立而師之其後不能對諸子之問乃叱避而退則固有常師之號其說非歟曰非也此太史公采雜說之謬宋子京蘇子由辨之矣孟子曰子夏子遊子張以有若似聖人欲以所事孔子者事之朱子云蓋其言行氣象有似之者如檀弓所記子遊謂有若之言似夫子之類是也豈謂貌之似哉曰有子不列於四科其人品何如曰宰我子貢有若智足以知聖人此孟子之言也蓋在言語之科宰我子貢之流亞也曰有子之言可得聞與曰盍徹之對出類拔萃之語見於論孟而論語首篇所載凡三章曰孝弟曰禮曰信恭尤其精要之言也其論晏子焉知禮則檀弓述之矣荀子云有子惡臥而焠掌可以見其苦學曰朱子謂有子重厚和易其然與曰吳伐魯衛虎欲宵攻王舍有若與焉可謂勇於為義矣非但重厚和易而已也曰有子曾子並稱然斯道之𫝊惟曽子得之子思孟子之學曽子之學也而有子之學無𫝊焉何歟曰曽子守約而力行有子知之而已智足以知聖人而未能力行也家語稱其强識好古其視以魯得之者有間矣曰學者學有子可乎曰孝弟務本此入道之門積德之基學聖人之學莫先焉未能服行斯言而欲凌髙厲空造一貫忠恕之域吾見其自大而無得也學曾子者當自有子之言始曰檀弓記有子之言皆可信乎曰王無咎嘗辨之矣若語子遊欲去喪之踊孺子䵍之喪哀公欲設撥以問若若對以為可皆非也惟論語所載為是春秋正義云哀公問主於宰我按古論語及孔鄭皆以為社主張包周等並為廟主今本作問社集解用孔氏說凡建邦立社各以其土所宜之木亦不言社主然正義必有據張衡思𤣥賦匪仁里其焉宅兮匪義迹其焉追注引里仁為美宅不處仁焉得知里宅皆居也石林云以擇為宅則里猶宅也蓋古文云然今以宅為擇而謂里為所居乃鄭氏訓解而何晏從之當以古文為正致堂云里居也居仁如里安仁者也商為起豫理明辭逹也回非助我默識心通也說苑管仲築三歸之臺以自傷於民集注取之舉直錯諸枉舉枉錯諸直孫季直謂舉直而加之枉之上則民服枉固服於直也舉枉而加之直之上則民不服直固非枉之所能服也若諸家解何用加二諸字王景文曰孔子見起證而知其末故曰其或繼周者雖百世可知也孟子見進證而知其極故曰千嵗之日至可坐而致也邵氏見用證而知其窮故曰茍有命世之人雖民如夷狄三變而帝道可舉惜時無百年之世世無百年之人時難人難不其然乎邵子之言見觀物篇默而識之朱子謂不言而存諸心屢空不取虛中之說恐學者流於異學也申棖鄭康成云蓋孔子弟子申續史記云申棠字周家語云申續字周今史記以棠為黨家語以續為績𫝊寫之訛也後漢王政碑云有羔羊之潔無申棠之欲亦以棖為棠則申棠申棖一人爾唐開元封申黨召陵伯又封申棖魯伯宋祥符封棖文登侯又封黨淄川侯俱列從祀黨即棠也一人而為二人失於詳考論語釋文也史記索隱謂文翁圖有申棖申棠今所傳禮殿圖有申黨無申棖甘羅曰項槖七嵗為孔子師董仲舒對䇿此無異於逹巷黨人不學而自知孟康注人項槖也𨽻釋載逢盛碑以為后槖孟康之說未知所出論語注疏無之師摯之始鄭康成謂魯太師之名太師摯適齊孔安國以為魯哀公時人康成以為周平王時人班固禮樂志謂殷紂作淫聲樂官師瞽抱其器而奔散或適諸侯或入河海古今人表列太師摯以下八人於紂時吳斗南云按商本紀紂世抱樂器而奔者太師疵少師疆也人表亦列此二人於師摯八人之後誤合兩事為一石林云司馬遷論周厲王事曰師摯見之矣則師摯厲王時人也諸說不同橫渠從孔安國注考其所為觀其所由察其所安亦見大戴禮文王官人篇老彭鄭注云老聃彭祖龜山云老氏以自然為宗謂之不作可也朱子曰以曽子問言禮證之述而不作信而好古皆可見蓋聃周之史官掌國之典藉三皇五帝之書故能述古事而信好之如五千言或古有是語而𫝊之列子引黃帝書即谷神不死章也聃雖知禮謂行之反以多事故欲滅絶之禮運謀用是作兵由此起亦有此意致堂曰仲尼問禮或以證舊聞或以絶滅禮學之故振而作之使於問答之際有啓發非以為師也王無咎云鹿邑之外有互鄉城邑人相𫝊謂互鄉童子見孔子者此處也前代因立互鄉縣其城猶存不舍晝夜釋文音拾集注亦云上聲而楚詞辨證云洪引顔師古曰舍止息也屋舍次舍皆此義論語不舍晝夜謂曉夕不息耳今人或音捨者非是辨證乃朱子晚嵗之書當從之龎涓孫臏同學兵法蘇秦張儀同學縱衡李斯韓非同學刑名始也朋而終也仇故曰小人同而不和比而不周思欲近近則精慮欲逺逺則周四教以文為先自博而約四科以文為後自本而末互鄉童子則進之開其善也闕黨童子則抑之勉其學也草廬一言而定三分之業一言之興邦也夕陽亭一言而召五胡之禍一言之喪邦也唐太宗文學館學士許敬宗與焉裴晉公淮西賔佐李宗閔與焉以是知佞人之難逺尹和靖云君臣以義合者也故君使臣以禮則臣事君以忠東澗謂如言父慈子孝加一則字失本義矣以能問於不能以多問於寡有若無實若虛犯而不校顔子和風慶雲之氣象也富貴不能淫貧賤不能移威武不能屈孟子泰山巖巖之氣象也麻冕禮也今也純儉鄭注純黑繒也側基反而釋文以鄭為平音今讀者從上音如字非也按儀禮疏古緇䊷二字並行緇布之緇本字不誤䊷帛之䊷多誤為純周禮純帛注純實緇字古緇以才為聲詩行露箋䊷帛釋文云䊷音緇依字系旁才後人以才為屯因作純又丰詩箋云士妻䊷衣儀禮云純衣釋文無音亦非集注純絲也從說文君子不以紺緅飾孔氏注一入曰緅石林云考工記三入為纁五入為緅七入為緇緅在纁緇之間爾雅一入為縓禮練衣黃裏縓緣練冠麻衣縓緣蓋孔氏誤以緅為縓則緅不可為近喪服集注謂緅絳色以飾練服亦用孔注正義曰一入為緅未知出何書又云三年練以緅飾衣似讀緅為縓當以石林之說為正馬融注論語云所因三綱五常大學衍義謂三綱之說始見於白虎通愚按谷永𫝊云勤三綱之嚴太𤣥永次五云三綱得於中極天永厥福其義尚矣按禮記正義引禮緯含文嘉有三綱之㫖然緯書亦起於西漢之末太平御覽引莊子曰孔子病子貢出卜孔子曰子待也吾坐席不敢先居處若齊食飲若祭吾卜之久矣子路請禱可以參觀仁者靜孔安國云無欲故靜與太極圖說同石林解執禮云猶執射執御之執記曰秋學禮執禮者詔之蓋古者謂治禮書以治人者皆曰執周官太史大祭禮宿之日讀禮書祭之日執禮一次位常凡射事執其禮事此禮之見於書者也解雅頌各得其所云季札觀魯樂以小雅為周德之衰大雅為文王之德小雅皆變雅大雅皆正雅楚莊王言武王克商作頌以時邁為首而武次之賚為第三桓為第六以所作為先後以此考之雅以正變為大小頌以所作為先後者詩未刪之序也論政事之廢興而以所陳者為大小推功德之形容而以可告者為先後者刪詩之序也其說可以補注義之遺吕氏春秋楚有直躬者其父竊羊而謁之上上執而將誅之直躬者請代之將誅矣告吏曰父竊羊而謁之不亦信乎父誅而代之不亦孝乎信且孝而誅之國將有不誅者乎荆王聞之乃不誅也孔子聞之曰異哉直躬之為信也一父而載取名焉故直躬之信不若無信此即葉公所云也致堂曰直躬猶曰正已吕氏春秋以為人姓名妄矣周生列子云舜嘗駕五龍以騰唐衢武嘗服九駿以馳文塗此上御也謂五臣九臣文子曰人皆以無用害有用故知不博而日不足以博奕之日問道聞見深矣可以發明無所用心之戒言無所用心之害非以博奕為賢也讀此章者當以韋昭之論陶侃之言參觀曹操祭橋𤣥文云仲尼稱不如顔淵注引論語孔子謂子貢吾與汝俱不如也按包氏解曰吾與汝俱不如周有八士包氏注云四乳生八子其說本董仲舒春秋繁露謂曰四産得八男皆君子雄俊此天所以興周國周書武寤篇尹氏八士注云武王賢臣晉語文王詢八虞虞官以仲舒興周之言考之當在文武時東坡解孟莊子之孝為獻子石林謂以獻子為穆伯之子以惠叔為惠伯讀在氏不精二者皆誤致堂取蘇說而不辨其誤吕氏春秋不茍論云孔丘墨翟晝日諷誦習業夜親見文王周公旦而問焉注引論語夢見周公孔墨並稱始於戰國之士其流及於漢儒雖韓退之亦不免逸民各論其行而不及朱張或曰其行與孔子同故不復論也釋文引王弼注朱張字子弓荀卿以比孔子虞仲夷逸隱居放言包氏注放置也不復言世務介之推曰言身之文也身將隱焉用文之中庸曰其默足以容古注亦有味論語疏按春秋少陽篇伯夷姓墨名允字公信伯長也夷諡叔齊名智字公逹伯夷之弟齊亦諡也少陽篇未詳何書曰春秋少陽夷齊之父名初字子朝胡明仲曰少陽篇以夷齊為伯叔之諡彼己去國隱居終身尚誰加之節惠哉蓋如伯逹仲忽亦名而已矣沮溺荷蓧之行雖未能合乎中陳仲子之操雖未能充其類然惟孔孟可以議之斯人清風逺韻如鸞鵠之髙翔玉雪之不汙視世俗殉利無恥叨榮茍得者猶腐鼠糞壤也小人無忌憚自以為中庸而逸民清士乃在譏評之列學者其審諸吕氏春秋云子路掩雉得而復釋之蓋因子路共之而為此說朱子集注引朝劉兩說共字當為拱執之義上蔡云聖人語常而不語怪語德而不語力語治而不語亂語人而不語神本王無咎之說陸務觀云一言可以終身行之者其恕乎此聖門一字銘也詩三百一言以蔽之曰思無邪此聖門三字銘也為力不同科馬融解云力役有上中下三科五峰謂此說是譬諸草木區以别矣五峰云草木生於粟粒之萌及其長大根莖華實雖凌雲蔽日據山蟠地從初具乎一萌之內而未嘗自外增益之也用樂記區萌字音勾朱文公曰林少頴說與黃祖舜亦如此漢藝文志小道可觀蔡雍𫝊致逺則泥以子夏之言為孔子唐孔頴逹傳以能問於不能以曽子之言為孔子卞莊子之勇或問云事見新序愚按荀子大略篇齊人欲伐魯忌卞莊子不敢過卞此可見其有勇也史記正義首陽山有五顔師古注漢書云伯夷歌登彼西山當以隴西為是石曼卿詩曰耻生湯武干戈日寧死唐虞揖讓區謂首陽在河東蒲坂乃舜都也余嘗考之曽子書以為夷齊死於濟澮之間其人成名於天下又云二子居河濟之間則曼卿謂首陽在蒲為得實水一也孔子觀之而明道體之無息孟子觀之而明為學之有本荀子亦云水至平端不傾心術如此象聖人其觀於水亦亞於孟子矣於此見格物之學吕成公讀論語躬自厚而薄責於人遂終身無暴怒潔齊見象山讀康誥有感悟反巳切責若無所容前人切已省察如此孔庭之教曰詩禮子思曰夫子之教必始於詩書而終於禮樂雜說不與焉荀子勸學亦曰其數則始乎誦經終乎讀禮其義則始乎為士終乎為聖人四勿九思皆以視為先見弓以為蛇見寢石以為伏虎視汨其心也閔周者黍稷不分念親者莪蒿莫辨心感其視也吳筠心目論以動神者心亂心者目隂符經心生於物死於物機在目蔡季通釋其義曰老子曰不見可欲使心不亂西方論六根六識必先曰眼曰色均是意也古者士𫝊言諫其言責與公卿大夫等及世之衰公卿大夫不言而士言之於是有欲毁鄉校者有謂處士橫議者不知三代之盛士亦有言責也夫子曰天下有道庶人不議其指微矣非帷裳必殺之鄭康成云帷裳謂朝祭之服其制正幅如帷非裳者謂深衣削其幅縫齊倍要見春秋正義孔門弟子惟言偃吳人而淡臺滅明南遊至江史記正義蘇州南五里有淡臺湖儒林𫝊淡臺子羽居楚韓非曰季孫相魯子路為郈令魯以五月起衆為長溝子路以其私秩粟為之飯要作溝者於五父之衢而飱孔子聞之使子貢往覆其飯擊毁其器曰魯君有民子奚為乃飱之言未卒而季孫使者至讓曰肥也起民而使之先生使弟子令徒役而飱之將奪肥之民耶孔子駕而去魯此說與論語史記不同然亦夫子去魯之一事也申屠嘉不受私謁則可以折幸臣董仲舒正身率下則可以事驕主魏相以亷正霍氏不能誣袁安任隗以素行竇氏無以害故曰其身正不令而行茍正其身矣於從政乎何有君子不因小人而求福孔子之於彌子也不因小人而避禍叔向之於樂王鮒也朱博之黨丁傅福可求乎賈捐之諂石顯禍可避乎故曰不知命無以為君子朱子以無垢為雜學論語集注獨取審富貴安貧賤之語陳仲猷曰逝者如斯夫道體無窮借水以明之鳶飛戾天魚躍于淵道體無不在借鳶魚以明之葉仲圭曰出入無時莫知其鄉常人之心也寂然不動感而遂通聖人之心也聖人之心豈常人之所無哉昏與明異而已矣王充曰浴乎沂涉沂水也風乎舞雩風歌也仲長統云諷於舞雩之下愚以風為諷則與詠而歸一意矣當從舊說上蔡論語解引元澤云教之化民也深於命民之效上也捷於令本史記趙良之言集注蘧伯玉於孫林父寧殖放殺之謀不對而出按左氏𫝊寧殖當為寧喜史記循吏傳孫叔敖三得相而不喜三去相而不悔與令尹子文之事相類恐是一事范伯崇曰溫故而不知新雖能讀墳典丘索足以為史而不足以為師劉子謹獨篇曰顔回不以夜浴改容顔氏家訓曰曽子七十乃學名聞天下皆未詳所出家語曽參少孔子四十六嵗非老而學者蘧伯玉史記謂孔子所嚴事不當在弟子列禮殿圖有之而唐宋皆錫封從享公伯寮非孔子弟子乃季氏之黨致堂胡氏之說當矣家語不列其名氏蓋自史記失之家語有孫亶字子象史記索隱以為縣豐唐宋封爵皆不及焉禮記檀弓言縣子豈其人歟桞子厚與太學諸生書曰仲尼吾黨狂狷南郭獻譏之按孫子法行篇南郭惠子問於子貢曰夫子之門何其雜也非以狂狷為譏無可無不可致堂謂以五字成文聖人從容中道無所偏倚世之通儻不泥者才足謂之無不可爾馬援以此稱髙帝亦稔於常談夫子之割之席曽子之簀一於正而已論學則曰正心論政則曰正身善人吾不得而見之矣得見有恆者斯可矣善人周公所謂吉士也有恆周公所謂常人也微生髙古今人表作尾生髙即莊子所謂尾生東方朔曰信若尾生然尾生之信非信也鄭校周之本以齊古讀正者凡五十事陳自明以子見南子為南蒯以𫝊考之昭公十二年南蒯叛孔子年方二十有二子路少孔子九嵗年方十三其說鑿而不通矣聖人毋必而鄉黨言必者十有五記必為之事也其易傳曰積善之家必有餘慶積不善之家必有餘殃隂疑於陽必戰小人勿用必亂邦也著必然之理也孔門受道惟顔曽子貢以子貢亦聞一以貫之之𫝊也過則勿憚改非禮勿視非禮勿聼非禮勿言非禮勿動已所不欲勿施於人勿欺也皆斷以勿蓋去惡不力則為善不勇孔門獨顔子為好學所問曰為仁為邦成己成物體用本末備矣唐棣與常棣不同致堂謂偏其反而即詩常棣篇孔子删而不取恐誤案歐陽修詩本義已有此說此以為胡寅之說蓋偶未考闕黨之童逰聖門者也夫子抑其躁是以知心之易放互鄉之童難與言者也夫子與其進是以知習之可移孝經十六條孝經序六家異同今考經典序録有孔鄭王劉韋五家而無虞翻注有虞槃東晉處士也致堂謂孝經非曾子所自為也曽子問孝於仲尼退而與門弟子言之門弟子類而成書朝子心謂何休稱子曰吾志在春秋行在孝經則孔子自著也今首章曰仲尼閒居則非孔子所著矣當是曽子弟子所為之書馮氏曰子思作中庸追述其祖之語乃稱字是書當成於子思之手古文孝經漢志書謂出孔壁而許冲上其父說文曰孝昭帝時魯國三老所獻其說不同當不義則子不可不爭於父孟子云父子之間不責善荆公謂當不義則爭之非責善也朝子心讀書志乃謂荆公阿其所好蓋子心守景迂之學以孟子為疑非篤論也朱子於孟子集注取荆公之說是何言與司馬公解云言之不通也范太史說誤以言之不通也五字為經文古今文皆無朱子集所載刋誤亦無之孝經鄭氏注陸德明云與康成注五經不同今按康成有六天之說而孝經注云上帝天之别名故陸澄謂不與注書相類荀子述孔子之言曰昔萬乘之國有爭臣四人則封疆不削千乘之國有爭臣三人則社稷不危百乘之國有爭臣二人則宗廟不輟父有爭子不行無禮士有爭友不為不義惟孝經稍異彭忠肅公以致敬致樂致憂致哀致嚴剖集格言為五致録司馬公家範亦以五致類事忠肅之書本於此國史志云孝經孔安國傳古二十二章有閨門篇為世所疑鄭氏注今十八章相承言康成作鄭志目録不載通儒皆驗其非開元中孝明纂諸說自注以奪二家然尚不知鄭氏之為小同王去非云學者學乎孝教者教乎孝故皆從孝字不敢毁傷至不敢失於臣妾言不敢者九管子賢者行於不敢而立於不能詩於文王仲山甫皆曰小心翼翼求忠臣必於孝子門者經緯之言也見東溪韋彪旁注劉盛不好讀書惟讀孝經論語曰誦此得行足矣安用多誦而不行乎蘇綽戒子威云讀孝經一卷足以立身治國何用多為愚謂梁元帝之萬卷不如盛綽之一言學不知要猶不學也范太史孝經說曰能事親則能事神真文忠公勸孝友曰侍郎王梅溪見人禮塔呼而告之曰汝有在家佛何不供養蓋謂人能奉親即是奉佛嚴父莫大於配天神宗寶訓云周公宗祀乃在成王之世成王以文王為祖則明堂非以考配明矣自唐代宗用杜鴻漸等議明堂以考肅宗配上帝一時誤禮非祀無豐昵之義孝子之事親終矣此言喪祭之終而孝子之心昊天罔極未為孝之終也曽子戰兢知免而易簣得正猶在其後信乎終之之難也孟子七十四條孟子集注序說引史記列𫝊以為孟子之書孟子自作韓子曰軻之書非自著謂史記近是而滕文公首章性善注則曰門人不能盡記其詞又第四章决汝漢注曰記者之誤吳伯豐以問朱子朱子答曰前說是後兩處失之熟讀七篇觀其筆勢如鎔鑄而成非綴緝所就也趙氏孟子章指引論語曰力行近仁誤以中庸為論語無垢孝經解誤以臨深履薄為衛武公之詩致堂無逸𫝊誤以不懈於位為泂酌吳才老書禪𫝊臣辨誤以晉侯重耳為申生誠齊易𫝊後序誤以韓宣子為季札文選陳孔璋為曹洪書云有子勝斐然之志注引墨子曰二三子復於子墨子曰告子勝仁子墨子曰未必然曰告子為仁猶跂以為長偃以為廣不可久也勝蓋告子之名豈即孟子所謂告子歟文選注引孟子曰墨子兼愛摩頂致於踵趙岐曰致至也今本作放踵注無致至也三字元和郡縣志齊雪宫故址在青州臨淄縣東北六里晏子春秋所謂齊侯見晏子於雪宫孟子以齊王猶反手也趙岐注謂譏管晏不勉其君於王業文王望道而未之見注云殷祿未盡尚有賢臣道未得至王無咎非之曰岐名通孟子而實汨之琴張注謂子張善鼓琴蓋未知左傳有琴張周公思兼三王以施四事注云四事禹湯文武所行事也而伏生大𫝊云周公思兼三王之道以施於春秋冬夏其說陋矣滕定公文公按趙氏注古紀世本滕國有考公麇元公𢎞即定公文公也世本今無傳此可備參考志曰喪祭從先祖注引周禮小史掌邦國之志愚謂邦國之志若周志史佚之志鄭書楚書秦記之類孟子疏謂齊王悅南郭先生吹竽喜鄒忌鼓琴安知與衆樂樂愚考之史記鄒忌以鼓琴見齊威王非宣王也惟南郭處士吹竽乃宣王時見韓非內儲說說苑景羌相鄭鄭人有冬涉水者出而脛寒後景羌過之下陪乘而載之覆以上袵叔向聞之曰景子為人國相豈不固哉吾聞良吏居之三月而溝渠修十月而津梁成六畜且不濡足而况人乎此即孟子所言子産以乘輿濟人之事也叔向之時鄭無景羌當以孟子為證曽西注以為曾子之孫集注因之經典序録曽申字子西曽參之子子夏以詩𫝊曽申左丘明作𫝊以授曽申曽西之學於此可見楚鬬宜申公子申皆字子西則曽西之為曽申無疑致惲曰孟子以彊其君之所不能為忠量其君之所不能為賊與今孟子語小異謹庠序之教申之以孝弟之義頒白者不負戴於道路矣愚按書大𫝊云嵗事既畢餘子皆入學十五入小學十八入大學距冬至四十五日始出學𫝊農事上老平明坐於右孰庶老坐於左孰餘子畢出然後歸夕亦如之餘子皆入父之齒隨行兄之齒雁行朋友不相踰輕任并重任分頒白不提挈出入皆如之此之謂造士漢書食貨志云春將出民里胥平旦坐於右孰鄰長坐於左孰云云入者必持薪樵輕重相分頒白不提挈孝悌之義當以是觀之棄禮捐恥秦所以敗恥尚失所晋所以替恥之於人大矣陳蕃諫校獵曰齊景公欲觀於海放乎琅琊晏子為陳百姓惡聞旌旗輿馬之音舉首嚬眉之感景公為之不行此以孟子二章為一事梁惠王西喪地於秦七百里潏水李氏曰初北地郡屬魏後盡為秦併喪於秦不止七百里也法言修身篇引孟子曰夫有意而不至者有矣未有無意而至者也今孟子無此語其在外書歟宋周子靜為學官小司成龔蓋卿以守氣不如守約命題子靜曰氣不與約字對兩守字著略㸃朱子注甚明豈可破句讀孟子尸子引孔子曰誦詩讀書與古人居金樓子曰曽生謂誦詩讀書與古人居讀書誦詩與古人期孟子誦其詩讀其書不知其人可乎斯言亦有所本命不可委故孟子言立命心不可委故南軒以淵明委心之言為非仁曰仁術儒曰儒術申不害亦曰術公孫𢎞謂智者術之原君子始惡乎術矣故學者當擇術致堂曰楊朱與老聃同時墨翟又在前宗師大禹而晏嬰學之以為楊墨出於師商考之不詳甚矣朱子曰莊周之學出於老氏韓子始謂子夏之後有田子方子方之後流而為莊周以其書之稱子方者考之則子方之學子夏周之學子方者皆不可見以是知異學之失非孔門弟子𫝊流之差也莊子曰為善無近名為惡無近刑緣督以為經又處夫材與不材之間此子莫之執中也楊之學似老墨之學似釋楊朱書惟見於列子董仲舒云以仁治人以義治我劉原父云仁字從人義字從我豈造文之意耶愚謂告子仁內義外之說孟子非之若以人我分仁義是仁外義內其流為兼愛為我矣孟子引費惠公之言謂小國之君也春秋時費為魯季氏之邑史記楚世家有鄒費郯邳蓋戰國時以邑為國意者魯季氏之僣歟仁人心也求其放心此孟子直指本心處但禪學有體無用曹交注謂曹君之弟按左傳哀公八年宋滅曹至孟子時曹亡久矣曹交蓋以國為氏者老泉三子知聖人汙論誤以汙字為句趙岐謂孟子知其言大過故貶謂之汙下亦非孟子之意史記六國表注皇甫謐曰孟子稱禹生石紐西夷人也今無此語孟子字未聞孔叢子云子車注一作子居居貧坎軻故名軻字子居亦稱字子輿疑皆傅㑹聖證論云子思書孔叢子有孟子居即是軻也傳云孟子輿孟子正義云唐林慎思續孟子書二卷謂孟子七篇非軻自著乃弟子共記其言與韓文公之說同正義序云孫奭崇文總目館閣書目讀書志皆無之朱文公謂邵武士人作不解名物制度其書不似疏吕氏春秋舜行德三年而三苖服孔子聞之曰通乎德之情則孟門大行不為險矣故曰德之速疾乎以郵𫝊命此可以證孟子引孔子之言墨之治喪以薄宋書禮志引尸子禹治水為喪法曰桐棺三寸制喪三月蓋墨家託於禹也好樂好勇好貨色齊宣王所以不能用孟子也文帝好清净故不能用賈誼武帝好紛更故不能用汲黯上有好者下必有甚焉光武封一卓茂而節義之俗成太宗誅一德儒而諫爭之門闢信乎如風之偃草也不仁而得天下未之有也秦皇以不仁得之矣二世而失猶不得也惟尹躬暨湯咸有一德克享天心故湯曰天吏尹曰天民孟子學伊尹者也當今之世舍我其誰也是亦聖之任仁在乎熟之而已矣子路未熟之五榖管仲已熟之荑稗楊墨五榖之螟􅀈照乘之珠和氏之璧戰國之君以為寶故曰諸侯之寶三惟天吏則可伐燕於漢楚見之董公未說漢王之前以强弱角勝負所謂以燕伐燕也三軍縞素之後則為天吏矣仁義之言齊梁以為迂濶者董公一言而楚漢之興亡决焉可謂豪傑之士弱而不可輕者民也古先哲王曰敬民曰畏民石守道謂湯以七十里亡夏文王以百里亡商陳勝以匹夫亡秦民可不畏乎故曰民為貴太史公以陳涉與湯武並言殊非其倫蓋楚漢間豪傑之餘論也善推其所為此心之充拓也求其放心此心之收斂也胡致堂曰心無理不運蔽而不能推則視之不見聼之不聞癢疴疾痛之不知存而善推則潜天地撫四海致千嵗之日至知百世之損益此言充拓之功也真西山曰心一而已由義理而發無以害之可使與天地參由形氣而發無以檢之至於違禽獸不逺此言收斂之功也不闔則無闢不涵養則不能推廣守孰為大守身為大有猷有為矣必曰有守不虧其義矣必曰不更其守何德將歎習之言曰入時愈深則趨正愈逺以守身為法以入時為戒可謂士矣行一不義殺一不辜而得天下皆不為也諸葛武侯謂漢賊不兩立其義正矣然取劉璋之事恐於義未協也君子可欺以其方難罔以非其道日無再中之理而新垣平言之日無漸長之理而袁充言之漢文隋文皆以是改元漢文悟平之詐而隋文終受充之欺此存亡之判與夫道一而已矣為善而雜於利者非善也為儒而雜於異端者非儒也堯使契為司徒教以人倫學所以明人倫舜察於人倫居中國去人倫無君子如之何其可也孟子道性善稱堯舜莫大於人倫正人心之本原也晏子春秋曰有賢而不知一不祥知而不用二不祥用而不任三不祥孟子謂言無實不祥不祥之實蔽賢者當之蓋古有此言也孺子滄浪之歌亦見於楚辭漁父考之禹貢漢水東為滄浪之水則此歌楚聲也文子亦云混混之水濁可以濯吾足乎泠泠之水清可以濯吾纓乎無恆産而有恆心者惟士為能古之士所以異於民也蘇秦無二頃田而奔走遊說豈所謂士哉水心葉氏云周衰不復取士孔孟不以其不取而不教也孔孟之徒不以其不取而不學也道在焉故也不得志修身見於世上蔡謝氏天下皆亂而已獨治不害為太平蜀士楊肩吾曰天下雖不治平而吾國未嘗不治且平者岐周是也一國雖不治平而吾家未嘗不治且平者曽閔是也一家雖不治平而吾身吾心未嘗不治且平者舜與周公是也文子亦云不憂天下之亂而樂其身治者可與言道矣鹽鐵論引孟子曰居今之朝不易其俗而成千乘之勢不能一朝居也又云今之士今之大夫皆罪人也又云王者與人同而如彼者居使然也與今本不同民心之得失此興亡之幾也林少頴云民之思漢則王莽不能脅之使忘民之忘漢則先主不能强之使思唐與政云民心思漢王郎假之而有餘民心去漢孔明扶之而不足按論語終於堯曰篇孟子終於堯舜湯文孔子而荀子亦終堯問其意一也利與善之間君子必審擇而明辨焉此天理人欲之幾善惡邪正之分界也孟子之言公不夷不惠可否之間材與不材之間楊莊之言私若將終身焉窮不失義若固有之逹不離道能處窮斯能處逹養心莫善於寡欲注云欲利也雖非本指亷者招福濁者速禍亦名言也道家者流謂丹經萬卷不如守一愚謂不如孟子之七字不養其心而言飬生所謂舍爾靈龜觀我朵頤也吕氏春秋開春論云神農之教曰士有當年而不耕者則天下或受其飢矣女有當年而不績者則天下或受其寒矣故身親耕妻親績所以見致民利也管子引神農之教文子亦引神農之法此即許行所謂神農之言歟漢藝文志農家有神農二十篇劉向别録云疑李悝商君所說孔子孟子皆不之秦荀子嘗入秦而譏其無儒孔子順曰秦為不義義所不入其志如魯仲連句容有盜改置社稷而盜止下邳多盜遷社稷於南山之上盜亦衰息見陳後山談叢嶽州田鼠害稼雍明逺曰迎貓之祭不修也命祭之鼠隨以斃見范蜀公集孟子有變置社稷禮記有八蠟孰謂古制不可行於今乎孟子古本宿於澅水經注云澅水出時水東去臨淄城十八里所謂澅中也俗以澅水為宿留水以孟子三宿出澅故也今本作晝後漢耿弇進軍於晝史記晝邑人王蠋通鑑作晝求在我者盡性於已求在外者聼命於天李成季曰與其求於人曷若無欲於已與其使人可賤不若以賤自安吕居仁亦以見人有求為非以刃與政有以異乎邵子之論秦曰殺人之多不必以刃謂天下之人無生路可趨也商鞅富强之術誘三晋之民力耕於內而使秦民應敵於外使梁王用孟子之言施仁政於民秦焉得誘之仁勝不仁如春融氷泮故曰仁者無敵蓋大夫王歡漢泰山郡蓋縣故城在沂州沂水縣西北趙氏春秋論曰五伯者三王之罪人謂其三代而春秋之也齊桓其作俑也今之諸侯五伯之罪人謂其春秋而戰國之也晉定其作俑也今之大夫今之諸侯之罪人謂其戰國而七國之也晉之韓趙其作俑也止齊曰人多言常平出漢耿中丞顔師古以夀昌為權道豈知常平蓋古法孟子言狗彘食人食而不知檢塗有餓莩而不知發今文作檢班氏食貨志作斂是也夫豐嵗不斂飢嵗不發豈所謂無常平乎陳烈讀求其放心而悟曰我心不曽放如何不記書遂靜坐不讀書百餘日以收放心然後讀書遂一覽無遺前賢之讀書如此教民則無恆産因無恆心孟子言戰國之民也周之盛時以井牧授田以鄉遂設教攸介攸止蒸我髦士亦田野之秀民也不惟士有恆心民亦有恆心矣故曰文武興而民好善小學名物字義各種彚考四十二條爾雅注漢武帝時得豹文鼮鼠孝亷郎終軍知之賜絹百匹文選注引竇氏家𫝊以為竇攸世祖詔諸子弟從攸受爾雅二說不同爾雅西至於邠國謂之四極朱子曰邠國近在秦隴非絶逺之地愚按說文引爾雅曰西至汃國謂四極汃府中切汃西極之水也爾雅疏按尸子廣擇篇云墨子貴兼孔子貴公皇子貴裏田子貴均列子貴虛料子貴别囿其學之相非也數世矣而已皆弇於私也天帝后皇辟公𢎞廓閎博介忳夏慔蒙贖昄皆大也十有餘名而實一也若使兼公虛均裏平易别囿一實則無相非也仁意篇述太平之事云燭於玉燭飲於醴泉暢於永風春為青陽夏為朱明秋為白藏冬為元英四氣和為正光此之謂玉燭其雨時降萬物以嘉髙者不少下者不多此之謂醴泉其風春為發生夏為長贏秋為方盛冬為安靜四氣和為通正此之謂永風爾雅疏引舍人云按經典序録爾雅有犍為文學注二卷一云犍為郡文學卒史臣舍人漢武帝時待詔白虎通引親屬記即爾雅釋義也通典顔延之曰伯叔有父名則兄弟之子不得稱姪從母有母名則娣妹之子不可言甥且甥姪惟施與舅姑耳雷次宗云姪字有女明不及伯叔甥字有男見不及從母劉共父刋二程先生集改姪為猶子朱子謂古人固不謂兄弟之子為姪亦無云猶子者但云兄之子弟之子然從俗稱姪亦無害於義理也記禮者之言猶己子𫝊負版郭璞注未詳即桞子所謂作蝜蝂𫝊者也陸璣為詩草木疏劉香為離騷草木疏王方慶有園庭草木疏李文饒有山居草木記君子所以貴乎多識也然爾雅不釋􅀢蔜字書不見栮榿學者耻一物之不知其可忽諸檟苦茶注今呼早采者為茶晚取者為茗一名荈說文茗茶芽也東坡詩周詩記苦荼茗飲出近世急就篇注牡蒙一名黃昏後山詩黃昏湯疑即此也終軍之對鼮鼠盧若虛之辨鼫鼠江南進士之問天雞劉原父之識六駁可謂善讀爾雅矣蔡謨不識彭蜞人謂讀爾雅不熟田敏不知日及學之陋也唐元度十體書云周宣王太史籀始變古文著大篆十五篇秦焚詩書惟易與史篇得全逮王莽亂此篇亡失建武中獲九篇章帝時王育為作解說所不通者十有二三按文多引王育說如天屈西北為旡蒼頡出見秃人伏禾中因以制字說文叙試律試八體亡新使甄豐等改定古文時有六書書正義亦云秦有八體亡新六書萟文志謂漢興蕭何草律著其法曰太史試學童以六體試之律即尉律也六體非漢興之法當從說文叙改六為八急就篇長樂無極老復丁顔氏解為蠲其子孫之役非也即參同契所謂老翁復丁壯朱子詩云自度樽前老復丁黃庭經亦有此三字董彥逺除正字謝啓叙學涉獵其略云殘經不悟於郭亡闕文徒存於夏有馬不足一者既失其全虎多於六者自乖其數書殘武殪頌亂湯齊烏寫混淆魚魯雜糅增河南之邑為雒減漢東之國為隋避上則罪不從辛絶下則對自去口束束合而棘氏微口之省而疏姓絶定文於六穗之禾訓同於導分序於八寸之䇿執異為宗丁尾亂真鈎須失實書六書肖而既謬國名為卷為端而遂乖服制篆形誤僞誰正雲興之祁祁𨽻體散亡共守鸞聲之鉞鉞鎮定銀鐺之名車改金根之目知一束二縫之為耒指二首六身之為亥郡章立信救時惟正於四羊國史𫝊疑考義共惑於三豕傅會作九禾之秀離析為三刀之州合樂之奏妄加文武之為斌定經之名誤合日月之為易字失部居改白水真人之兆書忘形篆作非衣小兒之謡四十八安取於桑三十七未足語世梁父七十二家名雖具在尉律四十九類書蓋已亡誤存舟二問之為航安識門五目之為閏學者遍觀異書而求其安所從出亦多識之一也彥逺有古文集類序云孔安國以𨽻古易科斗故漢人不識古字開元又廢漢𨽻易以今文故唐人不識𨽻古今按書序為𨽻古定正義謂就古文體而從𨽻以定之雖𨽻而猶古蓋存古則可慕為𨽻則可識非謂𨽻書為𨽻古也宋景文公云蕭何自題蒼龍白虎二闕後世署書由何始說文扁署也從户冊户冊者署門户之文也夾漈金石略云祀巫咸大湫文李斯篆愚按方氏跋詛楚文以為秦惠文王二十六年石湖亦謂當惠文王之世後百餘年東巡泰山刻石則小篆非出於李斯古器銘云十有三月十有四月十有九月云正月乙子或云丁子吕與叔考古圖謂嗣王踰年未改元故以月數乙子即甲子丁子即丙子世質人淳取其同類不然殆不可考曽子固謂古字皆重出此文作二二者特二字耳毛伯敦祝下一字劉原父以為鄭曰文武時毛叔鄭也而吕與叔以為􅌏簠銘中上一字歐陽公以為張曰宣王時張仲也而與叔以為弡周義敦伯下一字歐陽公以為冏曰穆王伯冏也而與叔以為百古文難考幾於郢書燕說博古圖晉姜鼎銘用蘄綽綰眉夀伯碩父鼎銘用祈丐百祿眉夀綰綽孟姜敦銘綰綽眉夀石湖云似是古人祝延常語愚謂漢書安世房中歌云克綽永福顔氏注綽緩也亦謂延長張燕公謝碑額表云孔𫝊吳札之墳秦存展季之壠言孔子者始見於此金石録汲縣太公碑云晉太康二年得竹䇿之書其紀年康王六年齊太公望卒參考年數蓋夀一百一十餘嵗今按書顧命云齊侯吕伋則成王之末伋已嗣太公為齊侯矣潏水李氏云古印有文曰祭尊非姓名乃古之卿官也說苑載卿官又有祭正亦猶祭酒也秦詛楚文作於惠文王之時所詛者楚懷王也懷王逺屈平邇靳尚而受商於之欺致武關之執非不幸也然入秦不返國人憐之如悲親戚積怨深怒發於陳項而秦亡也忽焉六國之滅楚最無罪反爾好還天人之理也南公曰楚雖三户亡秦必楚吁秦詛楚耶楚詛秦耶徐楚金說文繫𫝊有通釋部叙通論祛妄類聚錯綜疑義系述等篇吕太史謂原夲斷爛每行减去數字故尤難讀若得精小學者以許氏說文參釋恐猶可補也浙東所刋得於石林葉氏蘇魏公本也說文飲器象爵者取其鳴節節足足也宋符瑞志鳯凰其鳴雄曰節節雌曰足足然則爵即鳯凰與宣和中陜右人發地得木簡于甕字皆章草檄云永初二年六月丁未朔七日丙寅朱子答吳斗南書謂東漢討羌檄日辰與通鑑長厯不同蓋指此也今考通鑑安帝永初二年六月乙未朔後漢紀五月有丙寅七月有戊辰恐當以長厯為正漢西域傳安息國書皆旁行為書記顔氏注今西方胡國及南方林邑書皆橫行不直下法苑珠林云造書凡有三人長名曰梵其書右行次曰佉盧其書左行少者蒼頡其書下行夾漈六書略云梵書左旋其勢向右華書右旋其勢向左韓文公曰凡為文辭宜略識字讀書難字過字豈易識哉李衡識字說曰讀書須是識字固有讀書而不識字者如孔光張禹許敬宗桞宗元非不讀書但不識字孔光不識進退字張禹不識剛正字許敬宗不識忠孝字桞宗元不識節義字此可為學者之戒周越書苑云郭忠恕以為小篆散而八分生八分破而𨽻書出𨽻書悖而行書作行書狂而草書聖以此知𨽻書乃今真書趙明誠謂誤以八分為𨽻自歐陽公始庾肩吾云𨽻者今之正者正書張懷瓘云𨽻書云者程邈造字皆真正亦曰真書千文云杜藁鍾𨽻王羲之傳尤善𨽻書康節邵子之父古字天復定律吕聲音以正天下音及古今文謂天有隂陽地有剛柔律有闢翕吕有唱和一隂一陽交而日月星辰繫焉一剛一柔交而金木水火備焉一闢一翕而平上去入備焉一唱一和而開發收閉備焉律感吕而聲生焉吕應律而音生焉觀物之書本於此謂闢翕者律天清濁者吕地先閉後開者春也純開者夏也先開後閉者秋也冬則閉而無聲東為春聲陽為夏聲此見作韻者亦有所志也銜凡冬聲也橫渠張子曰商角徴羽皆有主出於唇齒喉舌宫聲全出於口以兼五聲也夾漈鄭氏曰聲為經音為緯平上去入四聲也其體縱故為經宫商角徴羽半徴半商七音也其體橫故為緯七音三十六字母出於西域豈所謂學在四夷者與司馬公以三十六字母總三百八十四聲為二十圖夾漈謂梵人長於音所得從聞入華人長於文所得從見入華則一音詠一字梵則一字或貫數音諧聲六書之一也聲韻之學尚矣夾漈謂五書有窮諧聲無窮五書尚義諧聲尚聲釋文序録云古人音聲止為譬况之說孫炎始為反語考古編謂周顒始有翻切非也隋陸法言切韻五卷後有郭知元者九人增加唐孫愐有唐韻廣韻則宋朝景德祥符重修後人以三書為一或謂廣韻為唐韻非也鶴山魏氏云唐韻於二十八刪二十九山之後繼以三十先三十一仙及平聲分上下以一先二仙為下平之首不知先字蓋自真字而來考徐景安樂書凡宫為上平商為下平角為入徴為上羽為去則唐時平聲已分上下矣米元章云五聲之音出於五行自然之理沈隱侯只知四聲求其宫聲不得乃分平聲為二然後魏江式曰晉吕靜倣李登聲類之法作韻集五卷宫商角徴羽各為一篇則韻分為五始於吕靜非自沈約始也約答陸厥曰宫商之聲有五文字之别纍萬之繁配五聲之約髙下低昂非思力所及沈存中云梵學入中國其術漸密潜虛以䒶為天古文也見廣韻而集韻不載古文韻䒶字碧落文今增入廣韻言姓氏甚詳然充字有充虞歸字有齊歸其遺闕多矣賁育謂孟賁夏育廣韻以賁為姓謂古有勇士賁育謬矣顔魯公在湖州集文士托古今文字為韻海鏡源三百六十卷以包荒萬彚其廣如海自來尋源照之如鏡崇文總目僅存十六卷後不載韓非正蠧曰蒼頡之作書也自環者謂之私背私謂之公說文云自營為某背某為公宋元憲寶玩佩觹三篇蘇文忠每出必取聲韻音訓文字置篋中朝以道晚年日課識十五字鄭夾漈謂說文定五百四十類為字之母然母能生而子不能生誤以子為母者二百十類吳孫休自制名字以命其子武曌劉龑因之皆字書所無梁四公記亦然隋志以蒼頡訓纂滂喜為三蒼說文繫傳以蒼頡爰歷博學為三蒼并訓纂為四篇急就章沐浴揃搣寡合同莊子外物篇眥􅩧可以休老亦作揃搣不字本方久反凡書之不字皆㸃入聲其字本音箕凡書之其字皆㸃平聲出攻愧集李瀚蒙求以平聲與上去入相間近世讀蒙求者不知此攻愧集云經說二十一條六經始見於莊子天運篇以禮樂詩書易春秋為六藝始見於太史公滑稽列𫝊或云七經蜀秦宓謂文翁遣相如東受七經或以六經六緯為十二經莊子天道篇或以五經五緯為十經或云九經釋文序録易書詩春秋周禮儀禮禮記孝經論語唐谷邦律𫝊九經庫始有九經之名樂經既亡而有五經自漢武立博士始也邵子定以易詩書春秋為四經猶春夏秋冬皇帝王伯漢藝文志云六藝之文樂以和神仁之表也詩以正言義之用也禮以明體故無訓書以廣聼知之術也春秋以斷事信之符也五者蓋五帝之道相須而備而易為之源白虎通云有五常之道故曰五經樂仁書義禮易智詩信也二說不同然五經兼五常之道不可分也後漢翟酺曰文帝始置易經博士考之漢史文帝時申公韓嬰皆以詩為博士五經列於學官者惟詩而已景帝以轅固為博士而餘經未列武帝建元五年春初置五經博士儒林𫝊贊曰武帝立五經博士書惟有歐陽禮后易楊春秋公羊而已立五經而獨舉其四蓋詩已立於文帝時今并詩為五也石經有七漢熹平則蔡雍魏正始則邯鄲淳晋裴頠唐開成中唐元度後蜀孫逢吉等宋嘉祐中楊南仲等南渡髙宗御書後蜀石經於髙祖太宗諱皆缺畫唐之澤深矣唐儒學𫝊序文宗定五經鑱之石張參等是正訛文按文粹劉禹錫國學新修五經壁記云初大厯中名儒張參為司業始詳定五經書於論堂東西廂之壁序以參為文宗時誤矣參所定乃書於壁非鑱石也舊史記云開成二年十月癸卯宰臣判祭酒鄭覃進石壁九經一百六十卷㑹要載是年八月覆定石經字體官唐元度狀今所詳覆多因司業張參五經字為凖萟文志參有五經文字三卷元度有九經字樣一卷文宗時是正訛文乃元度非參也皇覽冢墓記曰漢明帝時公卿大夫諸儒八十餘人論五經誤失符節令宋元上言秦昭王與吕不韋好書皆以書葬王至尊不韋久貴冡皆以黃腸題溱處地髙燥未壞臣願發昭王不韋冢視未燒詩書愚謂儒以詩書發冡莊子譏假經以文姦者爾乃欲發冢以求詩書漢儒之陋如此歐陽文忠公筆說云安昌侯張禹曰必博見然後識其真僞當考所出艾軒云日用是根株文字是注腳此即象山六經注我之意蓋欲學者於踐履實地用功不但尋行數墨也虞傅勵學曰聖人之道淡而寡味故學者不好也及至期月所觀彌博所習彌多日聞所不聞日見所不知然後心開意朗敬業樂羣忽然不覺大化之陶已至道之入神也學者不患才不及而患志不立任子曰學所以治己教所以治人不勤學無以為智不勤教無以為仁此皆天下名言隋文中子有言聖人述史三焉書詩春秋三者同出於一陸魯望謂六藝之中有經有史禮詩易為經書春秋實史耳舜臯陶之𢋫歌五子之歌皆載於書則詩與書一也文中子之言當矣元微之云觀書每得一義如得一真珠船見陸農師詩注古未有板本好學者患無書桓談新論謂梁子初楊子林所寫萬卷至於白首南齊沈驎士年過八十寫細書數十篋梁袁峻自寫書課日五十紙抱朴子所寫反覆有字金樓子謂細書經史莊老離騷等六百二十四卷在巾箱後魏斐漢借異書躬自録本其勤與編蒲緝柳一也宋史藝文志唐末益州始有墨板多術數字學小書後唐詔儒臣田敏校九經鏤板於國子監宋初廣諸義疏音釋令孔維邢昺讎定頒布春秋正義云傅咸為七經詩王羲之寫今按萟文類聚初學記載傅咸周易毛詩周官左傳孝經論語詩皆四言而闕其一鄭康成注二禮引易說書說樂說春秋說禮家說孝經說皆緯候也河洛七緯合為八十一篇河圖九篇洛書六篇又别有三十篇七經緯三十六篇易緯稽覽圖乾鑿度坤靈圖通卦驗是類謀辨終備書緯璇璣鈐考靈曜刑德放帝命驗運期授詩緯推度災記歷樞含神務禮緯含文嘉稽命徴斗威儀樂緯動聲儀耀嘉計圖徴孝經緯援神契鉤命决春秋緯演孔圖元命包文耀鉤運斗樞感精符合誠圖考異郵保乾圖漢含孽佑助期握誠圖潛潭巴說題辭又有尚書中候論語䜟在七經之外按李尋有五經六緯之言蓋起於哀平至光武篤信之諸儒習為內學隋焚其書今惟易緯存焉正義多引䜟緯歐陽公欲取九經之疏删去䜟緯之文使學者不為怪異之書惑亂然後經義純一其言不果行朱子謂五經疏周禮最好詩禮記次之書易為下考之隋志王弼易孔安國書至齊梁始立國學故諸儒之說不若詩禮之詳實司馬溫公曰新進後生口傳耳剽讀易未識卦爻已謂十翼非孔子之言讀禮未知篇數已謂周官為戰國之書讀詩未盡周南召南已謂毛鄭為章句之學讀春秋未知十二公已謂三傳可束之高閣朱子曰近日學者病在好高論語未問學而時習便說一貫孟子未言梁惠王問利便說盡心易未看六十四卦便讀繫辭此皆躐等之病宋符瑞志云孔子齊戒向北辰而告備於天曰孝經四卷春秋河洛凡八十一卷謹以備矣見援神契是以聖人為巫史也緯書誕妄而沈約取之無識甚矣家語齊太史子餘歎美孔子云天其素王之乎素空也言無位而空王之也董仲舒對䇿云見素王之文賈逵春秋序云立素王之法鄭康成六萟論云自號素王盧欽公羊序云制素王之道皆因家語之言而失其義所謂郢書燕說也莊子云元聖素王之道祥符中諡孔子為元聖後避宋太祖名改至聖自漢儒至宋慶厯間論經者守訓詁而不鑿也經小傳出而稍尚新竒矣至三經義行視漢儒之學若土梗古之講經執卷而口說未嘗有講義也宋元豐間陸農師在經筵始進講義自時厥後上而經筵下而學校皆為支離曼衍之詞說者徒以資口耳聽者不復相問難道愈散而習愈薄矣陸劍南曰唐及國初學者不敢議孔安國鄭康成况聖人乎宋之諸儒發明經㫖有非前人所及然排繫辭毁周禮疑孟子譏書之𦙍征顧命黜詩之小序不難於議經况傳注乎斯言可以針談經者之膏肓西山真氏大學衍義後序謂有進姦言於經幄者或以問西山之子仁甫答云講易乾卦之文言知進退存亡為姦言以罔上秦有誓而書亡魯有頌而詩亡魯郊禘秦僭畤而禮亡大夫肆夏三家雍徹而樂亡法言曰古之學者耕且飬三年通一經萟文志曰古之學者耕且飬三年而通一萟蓋劉歆七略取法言之語儷考榖梁隱四年傳注云建儲非以私親所以定名分宋鄧潤甫東宮制云建儲非以私親蓋明萬世之統主器莫若長子兹本百王之謀蓋出於此晏元獻謝申王記室表云衣存缺袵式贊於謙中饌去邪蒿不忘於規諫韓詩外傳周公誡伯禽曰衣成則必缺袵宮成則必缺隅九章算術五雀六燕集於衡衡適平一雀一燕燕飛而易處則雀重而燕輕陸農師謝吏部尚書表六燕相停試詮平其輕重蓋用此周書王會東越海􅧳或誤為侮食而王元長詩序用之其别風淮雨之類乎唐駱賔王云類同心異者龍蹲歸而宋樹伐質殊聲合者魚形出而吳石鳴龍蹲謂孔子春秋演孔圖孔子坐如蹲龍立如牽牛楊盈川叙郡守云代臨本州則元賔之父喜形於色繼為本守則張翕之子迎者如雲叙縣令曰仁之所懷幼童不能擊將雛之雉明之所斷老父不能爭食粟之雞對語精工蘇許公制右掖司言佇光於五字常衮表五字非工張南史詩惟有五字表魏志司馬景王命中書令虞松作表再呈輒不可意中書侍郎鍾㑹取視為定五字松悅服西掖用五字本於此張文定草兩制薦舉敕云蓋舉類之來舊矣三代之盛王其必由之如聞外之議云是且啓私謁告請之弊也豫不以是待士大夫何士大夫自待之淺耶又察舉守令敕云夫天下之大官吏之衆獨不聞循良尤異者之達豫聽外臺之職豈非闕歟抑朝廷未有以導之也其視守令能以仁政得民民心愛之如古循吏然者宜以名上豫得以褒慰之亦以使四方之民知豫不專寵健吏所貴仁者爾尤延之謂二詔大哉言乎簡而盡直而婉丁寧惻怛之意見於言外至今誦之盎然如在春風中豈特公之文足以導上德意志慮亦當時善治足以起其文也愚謂君臣皆出於至誠故詞意之間靡不交孚千載令人想慕耳張文定行范文正公參政制云大恩之下難為報大名之下難為處矧兼二者可無勉哉爾尚朝夕以交修豫允迪前人勤教邦其永孚於休訓詞溫雅可以想見宋世太平之象宋開禧間追貶秦檜周南仲代草制云兵於五材誰能棄之首弛邉疆之禁臣無二心天之制也忍忘君父之讎又云一日縱敵遂貽數世之憂百年為墟誰任諸人之責南遷録載孫大鼎疏言遣檜間我以就和檜之奸狀著矣令人痛恨韓文公王仲舒銘云敷文帝階擢列侍從野處謝敷文閣直學士表云宣布中和方歌盛德之事擢列侍從遽復敷文之階雖借用而切當王輔嗣吐金聲於中朝此子復玉振江表微言之緒絶而復續不意永嘉之末復聞正始之音晋人之稱衛玠蓋所尚者清談也正始魏齊王芳年號胡武平啓以正始之遺音對奪朱之亂雅陸務觀常摘其誤王季海行東坡贈太師制云博觀載籍之傳幾海涵而地負逺追正始之作殆玉振而金聲恐亦襲武平之誤也若正始之清談非所以稱蘇公胡文定以親辭成都學事云矧當喜懼之年深計短長之日曽文清求歸侍云朝則倚門暮則倚閭常恐失望父曰嗟子母曰嗟季曷敢弭忘上官儀册周王文職表魏舟之象詞掩漢臺之駕上句用曹蒼舒事下句用柏梁臺詩梁王曰驂駕駟馬從梁來或以駕為卦引沛獻王占雨事非也洪景盧周茂振入館謝啓雖不若董彥逺之博如桃萊難悟柳丣本同幼婦外孫之義女郎世子之名亦儷語之工者野處草梁叔子制云鼎學士之大稱蓋用劉禹錫天平壁記以牙璋玉節鼎右僕射官稱之語又草葉顒左相制云學聖人之道高天下以聲或云葉語音高故以戲之然矜人臣以能高天下以聲史記謂殷紂也不當用之王言當時亦有不檢如此者徐淵子上梁文云林木翳然便有濠濮間想清風竦至自謂羲皇上人初寮啓云得知千載上賴古書作吏一行便廢此事皆全句李宗道春秋十賦屬對之工如越椒熊虎之狀弗殺必滅若敖伯石豺狼之聲非是莫喪羊舌王子爭囚而州犂上下伯輿合要而范宣左右魯昭之馬將為櫝衛懿之鶴有乘軒于奚辭邑而衛人假之器晉侯請隧而襄王與之田星已一終魯君之嵗亥有二首絳老之年作楚宮見襄公之欲楚效夷言知衛侯之死夷雞憚犧而斷其尾象有齒而焚其身虞不臘矣吳其沼乎好魯以弓請謹守寶賜鄭以金盟無鑄兵蛇出泉臺聲姜薨鳥鳴亳社伯姬卒晏元獻進牡丹歌詩表云永平神爵之頌孝明稱美者五人貞元重九之篇德宗考第於三等按論衡云永平中神雀羣集詔上神雀頌百官上頌文比瓦石惟班固賈逵傅毅楊終侯諷五頌金玉孝明覽焉貞元事見劉太真傳宋寧皇服藥赦文陳正父所草也內云雖不明不敏有辜四海望治之心然無怠無荒未始一毫從已之欲當時天下誦之謂寫出寧皇心事盧思道賀甘露云神漿可挹流味几户之前天酒自零凝照三階之下常衮賀雪云重隂益固應水澤腹堅之時積潤潛通迎土膏脉起之候皆儷語之工者俗語皆有所本如利市出易說卦左傳難為人出表記儋負出詩𤣥鳥箋拆閲出荀子生活出孟子家數出墨子服事出周禮大司徒伏事出陸士衡詩分付出漢原涉傳交代出蓋寬饒傳區處出黃霸傳多謝出趙廣漢𫝊丁寧出詩采薇箋什物出後漢宣秉傳自由出五行志曉示出童恢傳主者出劉陶傳意智出鮮卑傳卑末出欒巴傳告示出荀子仁者好告示人布施出周語布施優裕比校出齊語行頭出吳語當日出晉語地主出左傳越語相於出晉后妃傳料理出王徽之傳長進出和嶠傳消息出魏少帝紀功夫出王肅傳普請出吳呂蒙傳手下出太史慈傳牢固出陸抗傳鄭重出王莽傳分外出魏程曉上疏小却出宋紀間介出長笛賦間介無蹊婁羅出南史顧歡傳本分出荀子見端不如見本分措大出五代東漢世家假開出王峻傳本色出唐劉仁恭傳古老出書無逸注商量出易商兌注不宣備出楊德祖答臨淄侯不能宣備生人婦出魏杜畿傳私名出列子家公出莊子主人公也致意出晉簡文紀傳語出後漢清河王慶傳收拾出光武紀尋思出劉矩傳不審出韓詩外傳世情出墨子不無世情邇來出孔明出師表朅來出思𤣥賦和買出左傳正義阿誰出蜀龎統傳罷休出史記孔武傳慚愧出齊語安排出莊子比數出周禮大司馬注見在出藁人注孩兒出書康誥注老境出曲禮正義牽帥出左傳先輩出詩采薇箋如今出杕杜箋居士出玉藻可人出雜記道人出漢京房傳寄居出息夫躬傳某甲出周禮職內注道士出新序介子推云主人公出史記范雎傳小家子出漢霍光傳不中用出史記外戚世家王尊傳我輩人出晉石苞傳對岸出樂志十八九出漢丙吉傳至今十八九矣浩大出後漢馬廖傳兩兩相視出周嘉傳年紀出光武紀雜碎出仲長統傳細碎事手下出吳呂範傳合少成多出中庸注若干出禮記曲禮投壺如干出陳何之元傳膠加出九辨牢愁出揚雄傳畔牢愁集韻愁音曹黑缺出列子冗長出陸機文賦出狀出史記夏本紀擘畫出淮南子前定出中庸細作出左傳釋文叙致出世說留連出後漢劉陶傳問息耗出竇妃紀已分出魏文帝書物色出淮南子本師出史記樂毅傳祖師出漢外戚丁姬傳生熟出莊子有瓜葛出後漢禮儀志發遣出陳實傳天然出賈逵傳新鮮出太𤣥鈍悶出淮南子誇張出列子愺恅出洞簫賦近局出陶淵明詩提撕出詩抑箋本貫出晉江統論十字街出北史李庶傳見錢出漢書王嘉傳梁簡為子辭封表云日蝕之餘無黃童之對荷㦸入榛異子烏之辨又云熙祖流聰慧之稱方建臨淮之國元仲表岐嶷之資乃啓平原之封荷㦸入榛揚雄童烏熙祖晉太子遹字元仲魏明帝字王元之表風摧霜敗芝蘭之性終香日逺天高葵藿之心未死劉元城表云志存許國如萬折而必諫忠以事君雖三已而無愠斯言可以立懦志矣驢非驢馬非馬漢西域傳烏不烏鵲不鵲戰國䇿可以為對傅景仁云烹羊炮羔惟帶牛佩犢可對嘉定受寶璽南塘賀表云函封逺致不知何國之白環瑑刻孔章咸曰寧王之大寶王岐公答韓公詔豈朕鬱於大道未昭治亂之原將卿保其成功自潔進退之分崔大雅答周益公詔豈朕不德未達好賢之誠將卿既明自全引退之節蓋放其意鄭安晚再相應之道草制云彥博重入中書特令納節王曽再登揆席俯就集賢黃伯庸為賀雪表云招徠衆俊無晝卧洛陽之人奬勵三軍有夜出蔡州之志語工而健耿直之守京口復陳少陽之後曰如可贖兮百身猶將宥之十世用語亦妙億載萬年為父為母四海九州悉主悉臣迂齊之對也李顯忠復節鉞汪聖錫草制云念秦伯用孟明之意與馮唐靣文帝之言又云與人之周庶幾得頗牧而能用共武之服爾其繼英衛之善兵亦工宋倪正父草夀皇尊號制云率百官若帝之初丕講非常之禮於萬年受天之祜聿迎滋至之休周益公辭免表云遜於殳斨伯與敢忘稽首有若虢叔閎天尚助迪威正父答詔云殳斨伯與固可遜未聞虞帝之必從虢叔閎天雖曰賢蓋視周公而不及用經亦妙真西山為原貸盜賊詔云弄潢池之兵諒非爾志烈崑岡之火亦豈豫心又云自有宇宙至於今日未聞盜賊得以全軀其言足以感動人心王卿月草胡淡菴制云吾寧身蹈東海獨仲連不肯帝秦至今名重泰山微相如何以強趙盧肇海潮賦馬褐牛衣竟未有對崔大雅草史直翁制云皇祐之詔二老設几以須熙寧之遇四臣齎書而訪尚有斯禮勿遐爾心二老杜衍任布四臣韓富文曽呂東萊代其父倉部自黃州易守池州啓云爰考唐朝有杜牧把麾之舊其臨秋浦亦齊安解組之餘雖後先遷徙之偶同顧今昔風流之非匹宋濟王吳夫人復舊封王公代為謝丞相啓末聨云孤忠未泯敢忘漆室之憂葵厚德難酬願效老人之結草真西山除參政辭以疾趙南塘草詔云漢御史大夫吉當封病上憂之夏侯勝謂必愈果然後遂至相朕之賢卿甚於宣帝之德吉也卿其親醫藥自厚且先即舍拜命少間可就車朕遣黃門召見卿矣此詔有西漢之風鄭威愍公驤新除謝上章云關陜六七任不掛權臣之橫恩崇觀二十秋靡沾故相之餘潤公之大節如此厥後馮翊之死義其處之有素矣傅至樂上周益公啓云東門之柳自凋𤣥都之桃何在被刀頭之䑛蜜得未錙銖况井眉之居瓶恍如夢寐蓋指張說也宋人有上朱文公啓云行藏勛業銷倚樓看鏡之懷窈窕﨑嶇寄尋壑經丘之趣亦有意致宋正甫詩三甲未全一丁不識有就試縣見黜後預鄉薦以啓謝縣令有不平之意令答云大敵勇小敵怯古固有之今日是前日非吾無愧矣亦灑脫毛憲守長沙謝韓平原云湖南之地二千里序詩幸託於昌黎平原之客十九人脫穎願同於毛遂亦工切毛澤民啓云揚子雲貌寢官卑經雖𤣥而謂白九方臯機深識妙馬本驪而為黃李清卿啓云斯風未泯則朝取溫造而暮拔石洪吾道不行則近舍皇甫而逺求居易洪舜俞薦於鄉鞏嶸為監試後鞏任江東憲使洪分教鄱陽啓云東坡倅錢塘曽在門外鵠袍之列半山憲江左亦賞梁間燕語之詩徐淵子為越教答項平甫云正恐異時風舞雩之流不無或者月離畢之問或答洪舜俞云魯直大名有皎潔江梅之句少游下蔡無丁東佩玉之詞有郡守招士人教子辭曰士而託於諸侯非其義也師不賢於弟子將焉用之張宣公答教官云識其大者豈誦說云乎哉何以告之曰仁義而已矣真西山為江東轉運使有民困於買鳩之役來訴公判云詔捕鵁鶄若水尚還其使嵗貢蚶蛤孔戣猶疏於朝况為州縣之官可恣口腹之欲攻愧為姜氏慶七十致語云今日王孫猶有承平之故事舊時竹馬得見㑹昌之新春承平王孫見柳文姜崿志衢州稽古閣書臯陶謨於屏其上梁文云臯陶若稽古事三朝稽古之君孔子與斯文為萬世斯文之主王爚以親老辭督府辟其書曰昔溫太真絶襟違母以奉廣武之檄心雖忠而人議其失性徐元直指心戀母以辭豫州之命情雖窘而人豫其順天呂倚謝岐公饋酒錢用白水真人青州從事岐公稱之夏文莊表云詩㑹餘蚳之文簡凝含鴆之墨餘蚳見詩貝錦箋筆鋭干將墨含淳鴆出文心雕龍獨孤馴象世以為工子雲甘泉晚而悔作晏元獻謂賦也獨孤綬放馴象賦云返諸林邑之野歸爾梁山之隅時在偃兵豈嬰乎燧尾上惟賤賄寧恤乎焚軀唐律賦雞鳴度關云念秦關之百二難逞狼心笑齊客之三千不如雞口宋紹興中省試高祖能用三傑賦第四韻用運籌帷帳考官謂漢書乃帷幄非帷帳不敢取撤棘以語周益公益公曰史記云運籌帷帳之中非誤也淳熙中省試人主之勢重萬鈞賦第一聨有用洪鐘二字者考官哂之洪文敏典舉聞之曰張平子西京賦洪鐘萬鈞此必該洽之士遂預選紹熙中四明試航琛越水詩有用東坡舶趠二字而黜者決得失於一夫之目其幸不幸若此東都之季清議扶之而有餘強秦之末壯士守之而不足作萬世風俗之基末韻亶聰明而有作無作聰明由仁義以安行非行仁義非刀匕是供膳宰舉席間之觶釋椎鑿而上輪人議堂上之書此工執藝事以諫賦聨也亦工穩拾遺録
